name: Driving and 3D regression checks
on:
  push:
    branches: [main, feat/unified-3d-experience]
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:core
