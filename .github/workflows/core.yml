name: Driving and 3D regression checks
on:
  push:
    branches: [main, feat/unified-3d-experience, driftgame-psx]
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev --ignore-scripts
      - run: npm run test:core
      - run: node --test tests/psx.cjs
      - run: node --check js/psx-renderer.js
      - run: node --check js/view3d.js
      - run: node --check js/experience.js
